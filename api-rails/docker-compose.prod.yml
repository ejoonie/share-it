services:
  db:
    image: postgres:16
    env_file: .env.prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: sp_api_production
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  sp-api:
    container_name: sp-api
    image: ghcr.io/ejoonie/share-it-api:latest
    env_file: .env.prod
    environment:
      RAILS_ENV: production
    volumes:
      # FCM 발송용 서비스 계정 키. 레포에는 없음(.gitignore) - 배포 워크플로가
      # GitHub Secret에서 이 경로에 파일을 생성해둔다 (.env.prod의
      # FIREBASE_SERVICE_ACCOUNT_PATH와 같은 경로).
      - ./config/firebase/service_account.json:/rails/config/firebase/service_account.json:ro
    depends_on:
      - db
    restart: always

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sp-api

volumes:
  pgdata:
